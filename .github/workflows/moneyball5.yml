
name: Moneyball NFL 2026 - feed automatico

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'moneyball7_scout.py'
      - 'moneyball7_publish.py'
      - 'moneyball7_context.py'
      - 'moneyball72_projection.py'
      - 'moneyball8_*.py'
      - '.github/workflows/moneyball5.yml'
  schedule:
    # Lunes y martes, 07:20 Monterrey
    - cron: '20 13 * * 1,2'

    # Viernes, 20:20 Monterrey
    - cron: '20 2 * * 6'

    # Domingo, 08:20 Monterrey
    - cron: '20 14 * * 0'

permissions:
  contents: write

concurrency:
  group: moneyball-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Probar todos los módulos antes de actualizar datos
        run: python -m pytest -q

      - name: Reusar fuentes históricas 8.0
        uses: actions/cache@v4
        with:
          path: .cache/moneyball8
          key: moneyball8-nflverse-v1-${{ github.run_id }}
          restore-keys: moneyball8-nflverse-v1-

      - name: Procesar estadisticas NFL
        run: |
          mkdir -p data
          python moneyball5_etl.py --output data/_MONEYBALL_FEED_2026.json

      - name: Validar feed antes de publicar
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          compressed = Path("data/_MONEYBALL_FEED_2026.json.gz")
          assert compressed.is_file(), "No se genero el archivo GZIP"

          with gzip.open(compressed, "rt", encoding="utf-8") as f:
              feed = json.load(f)

          assert feed.get("schemaVersion") == 5, "Esquema incorrecto"
          assert feed.get("season") == 2026, "Temporada incorrecta"

          players = feed.get("bySleeper", {})
          assert isinstance(players, dict), "Formato de jugadores incorrecto"
          assert len(players) >= 100, "Cobertura insuficiente"

          through = int(feed.get("thruWeek", 0))
          assert 1 <= through <= 18, "Semana invalida"

          print("MONEYBALL VALIDACION OK")
          print("Jugadores:", len(players))
          print("Hasta semana:", through)
          print("Fuentes:", feed.get("sources", {}))
          PY

      - name: Calcular scouting Moneyball 7.0 desde el feed validado
        run: |
          python moneyball7_publish.py \
            --input data/_MONEYBALL_FEED_2026.json.gz \
            --output data/_MONEYBALL7_SCOUT_2026.json.gz

      - name: Calcular contexto DEF y K verificable (fuente opcional)
        continue-on-error: true
        run: |
          python moneyball7_context.py \
            --source-gzip data/_MONEYBALL_FEED_2026.json.gz \
            --output data/_MONEYBALL7_CONTEXT_2026.json.gz

      - name: Calibrar baseline histórico y registrar procedencia de lesiones 7.2
        continue-on-error: true
        run: |
          python moneyball72_projection.py \
            --source-gzip data/_MONEYBALL_FEED_2026.json.gz \
            --output data/_MONEYBALL72_PROJECTION_2026.json.gz

      - name: Generar pronóstico 8.0 con fuentes cacheadas y corte validado
        continue-on-error: true
        run: |
          python moneyball8_pipeline.py \
            --source-gzip data/_MONEYBALL_FEED_2026.json.gz \
            --output data/_MONEYBALL8_FORECAST_2026.json.gz \
            --pass-int-points -1

      - name: Detectar cambios de rol sin alterar proyección original
        continue-on-error: true
        run: |
          python moneyball8_role_pipeline.py \
            --forecast data/_MONEYBALL8_FORECAST_2026.json.gz \
            --source-gzip data/_MONEYBALL_FEED_2026.json.gz \
            --output data/_MONEYBALL8_ROLE_2026.json.gz

      - name: Publicar feed comprimido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/_MONEYBALL_FEED_2026.json.gz data/_MONEYBALL7_SCOUT_2026.json.gz
          if test -s data/_MONEYBALL7_CONTEXT_2026.json.gz; then
            git add data/_MONEYBALL7_CONTEXT_2026.json.gz
          fi
          if test -s data/_MONEYBALL72_PROJECTION_2026.json.gz; then
            git add data/_MONEYBALL72_PROJECTION_2026.json.gz
          fi

          if test -s data/_MONEYBALL8_FORECAST_2026.json.gz; then
            git add data/_MONEYBALL8_FORECAST_2026.json.gz data/_MONEYBALL8_VALIDATION.json data/history/
          fi
          if test -s data/_MONEYBALL8_ROLE_2026.json.gz; then
            git add data/_MONEYBALL8_ROLE_2026.json.gz data/role_history/
          fi
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "Actualizar feed NFL 2026"
            git push
          fi
