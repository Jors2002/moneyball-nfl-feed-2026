name: Moneyball 6.0 - pruebas de calidad

on:
  pull_request:
    paths:
      - 'moneyball6_validate.py'
      - 'moneyball5_etl.py'
      - 'tests/test_moneyball6_validate.py'
      - '.github/workflows/moneyball6-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verificar sintaxis de ETL y validador
        run: python -m py_compile moneyball5_etl.py moneyball6_validate.py
      - name: Ejecutar pruebas offline
        run: python -m unittest discover -s tests -p 'test_moneyball6_validate.py' -v
      - name: Auditar feed real comprimido
        run: |
          test -s data/_MONEYBALL_FEED_2026.json.gz
          python moneyball6_validate.py data/_MONEYBALL_FEED_2026.json.gz --max-age-hours 168 --report moneyball6_quality.json
      - name: Conservar reporte de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyball6-quality-report
          path: moneyball6_quality.json
          if-no-files-found: warn
