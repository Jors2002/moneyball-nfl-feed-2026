name: Moneyball 7 scouting unit tests

on:
  pull_request:
    paths:
      - 'moneyball7_scout.py'
      - 'tests/test_moneyball7_scout.py'
      - '.github/workflows/moneyball7-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_moneyball7_scout.py
